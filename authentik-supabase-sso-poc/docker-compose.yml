version: "3.8"

x-authentik-common: &authentik-common
  image: ghcr.io/goauthentik/server:2024.12.3
  restart: unless-stopped
  command: server
  environment:
    AUTHENTIK_REDIS__HOST: authentik-redis
    AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
    AUTHENTIK_POSTGRESQL__USER: authentik
    AUTHENTIK_POSTGRESQL__NAME: authentik
    AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
    AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
    AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
  volumes:
    - ./volumes/authentik/media:/media
    - ./volumes/authentik/custom-templates:/templates

services:
  # ── Authentik ─────────────────────────────────────
  authentik-postgresql:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - ./volumes/authentik/database:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${PG_PASS}
      POSTGRES_USER: authentik
      POSTGRES_DB: authentik

  authentik-redis:
    image: docker.io/library/redis:alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s

  authentik-server:
    <<: *authentik-common
    ports:
      - "9000:9000"
      - "9443:9443"
    depends_on:
      - authentik-postgresql
      - authentik-redis

  authentik-worker:
    <<: *authentik-common
    command: worker
    environment:
      <<: *authentik-common.environment
      AUTHENTIK_WORKER: "true"
    depends_on:
      - authentik-postgresql
      - authentik-redis

  # ── Supabase ──────────────────────────────────────
  supabase-db:
    image: supabase/postgres:15.1.1.06
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: postgres -c config_file=/etc/postgresql/postgresql.conf -c log_min_messages=fatal

  supabase-auth:
    image: supabase/gotrue:v2.158.1
    restart: unless-stopped
    depends_on:
      - supabase-db
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
      GOTRUE_SITE_URL: "http://localhost:3000"
      GOTRUE_URI_ALLOW_LIST: "http://localhost:3000/**"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_KEYCLOAK_ENABLED: "true"
      GOTRUE_EXTERNAL_KEYCLOAK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID}
      GOTRUE_EXTERNAL_KEYCLOAK_SECRET: ${AUTHENTIK_CLIENT_SECRET}
      GOTRUE_EXTERNAL_KEYCLOAK_URL: "http://oidc-proxy"
      GOTRUE_EXTERNAL_KEYCLOAK_REDIRECT_URI: "http://localhost:8000/auth/v1/callback"
      GOTRUE_MAILER_AUTOCONFIRM: "true"

  supabase-rest:
    image: postgrest/postgrest:v12.2.0
    restart: unless-stopped
    depends_on:
      - supabase-db
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}

  supabase-kong:
    image: kong:2.8.1
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
    volumes:
      - ./volumes/supabase/kong.yml:/var/lib/kong/kong.yml

  # ── oidc-proxy ────────────────────────────────────
  oidc-proxy:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./volumes/oidc-proxy/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - authentik-server

  # ── Web App ───────────────────────────────────────
  web:
    build:
      context: ./web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      AUTHENTIK_AUTHORIZE_URL: http://localhost:9000/application/o/authorize/
    depends_on:
      - supabase-kong
      - oidc-proxy
