server {
  listen 80;
  resolver 127.0.0.11;  # Docker internal DNS
  location /protocol/openid-connect/auth {
    proxy_pass http://authentik-server:9000/application/o/authorize/;
    proxy_set_header Host authentik-server;
  }
  location /protocol/openid-connect/token {
    proxy_pass http://authentik-server:9000/application/o/token/;
    proxy_set_header Host authentik-server;
  }
  location /protocol/openid-connect/userinfo {
    proxy_pass http://authentik-server:9000/application/o/userinfo/;
    proxy_set_header Host authentik-server;
  }
  location /protocol/openid-connect/certs {
    proxy_pass http://authentik-server:9000/application/o/poc/jwks/;
    proxy_set_header Host authentik-server;
  }
}
